<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>手書きメモ</title>
  <meta name="theme-color" content="#EEF0F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="手書きメモ">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ホーム:メモ一覧 / あとで確認 -->
  <section id="view-home" class="view" hidden>
    <header class="bar">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" id="tab-notes" role="tab" aria-selected="true">メモ</button>
        <button type="button" class="tab" id="tab-calendar" role="tab" aria-selected="false">カレンダー</button>
        <button type="button" class="tab" id="tab-flags" role="tab" aria-selected="false">
          あとで確認<span class="count" id="flag-count" hidden>0</span>
        </button>
      </div>
      <button type="button" class="btn-new" id="btn-new">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        新しいメモ
      </button>
    </header>
    <main class="home-main" id="home-main"></main>
  </section>

  <!-- 手書き画面 -->
  <section id="view-editor" class="view" hidden>
    <header class="bar">
      <button type="button" class="btn-back" id="ed-back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        一覧
      </button>
      <span class="ed-date" id="ed-date"></span>
      <div class="tools" role="toolbar" aria-label="道具">
        <button type="button" class="tool" data-tool="pen" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-4.4L16.4 4.4a2.1 2.1 0 013 3L8.2 18.6 4 20z"/></svg>
          <span>ペン</span>
        </button>
        <div class="colors" role="group" aria-label="ペンの色">
          <button type="button" class="color" data-color="#1F2A3A" aria-label="黒" aria-pressed="true"><span style="background:#1F2A3A"></span></button>
          <button type="button" class="color" data-color="#D33A2C" aria-label="赤" aria-pressed="false"><span style="background:#D33A2C"></span></button>
          <button type="button" class="color" data-color="#2563C9" aria-label="青" aria-pressed="false"><span style="background:#2563C9"></span></button>
        </div>
        <button type="button" class="tool" data-tool="eraser" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11"/><path d="M5.4 15.6l9.2-9.2a2 2 0 012.8 0l1.2 1.2a2 2 0 010 2.8L10 19H8.8l-3.4-3.4z"/></svg>
          <span>消しゴム</span>
        </button>
        <button type="button" class="tool tool-flag" data-tool="flag" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4h11l-2.5 4L17 12H6"/></svg>
          <span>あとで確認</span>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="tool" id="ed-undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
          <span>元に戻す</span>
        </button>
      </div>
    </header>
    <div class="ed-body">
      <div class="scroller" id="ed-scroller">
        <div class="sheet" id="ed-sheet">
          <div class="flag-layer" id="ed-flags"></div>
        </div>
      </div>
      <canvas class="live" id="ed-live"></canvas>
      <p class="hint" id="ed-hint" hidden>あとで確認したいところをペンで囲んでください</p>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
